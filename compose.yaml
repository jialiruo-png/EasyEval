services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eval_platform
      POSTGRES_USER: eval_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eval_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eval_platform", "-d", "eval_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eval_postgres:
