<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 评测平台 · 本地演示</title>
<style>
:root {
  color-scheme: light;
  --blue: #1664ff;
  --blue-dark: #1255e0;
  --blue-pale: #f0f5ff;
  --ink: #1f2430;
  --muted: #646b78;
  --quiet: #737a87;
  --line: #f0f0f0;
  --border: #e8e9ec;
  --input: #d9dce2;
  --wash: #fafafa;
  --green: #26734f;
  --red: #ae3e38;
  --amber: #806015;
  --page: 24px;
  font: 14px/1.55 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color: var(--ink);
  background: #fff;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--blue-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
header.site {
  position: sticky; top: 0; z-index: 5; height: 62px; padding: 0 var(--page);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: #fff; border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 16px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { width: 26px; height: 26px; display: grid; place-items: center; background: var(--blue-pale); color: var(--blue-dark); border-radius: 4px; font: 700 12px/1 ui-monospace, monospace; }
.header-tail { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.header-tail small { padding-left: 14px; border-left: 1px solid var(--border); font-size: inherit; }
main { margin: 0 auto; padding: var(--page); max-width: 1640px; min-height: calc(100vh - 62px); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 26px; line-height: 1.3; font-weight: 650; letter-spacing: -.35px; overflow-wrap: anywhere; }
h2 { font-size: 17px; line-height: 1.35; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p + p { margin-top: 7px; }
.titlebar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.titlebar .hint { margin-top: 6px; }
.hint { color: var(--muted); font-size: 13px; }
.subtle { color: var(--quiet); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; }
strong { font-weight: 650; }
.crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: 0 0 16px; color: var(--muted); font-size: 13px; }
.crumb a { color: var(--muted); }
.crumb span[aria-current] { color: var(--ink); }
.tabs { display: flex; gap: 30px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab { color: var(--muted); border-bottom: 2px solid transparent; padding: 10px 1px 11px; font-size: 14px; white-space: nowrap; }
.tab:hover { text-decoration: none; color: var(--blue-dark); }
.tab.active { border-color: var(--blue); color: var(--blue-dark); font-weight: 650; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 34px; gap: 6px;
  padding: 0 13px; border: 1px solid var(--input); border-radius: 4px; color: var(--ink);
  background: #fff; white-space: nowrap; text-decoration: none; font-weight: 500;
}
.btn:hover { color: var(--blue-dark); border-color: #90b3ff; text-decoration: none; }
.btn.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
.btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn:disabled { color: #777f8d; background: #f5f5f5; border-color: var(--border); }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 12px; }
.link { display: inline; border: 0; background: transparent; padding: 0; color: var(--blue-dark); font: inherit; text-align: left; }
.link:hover { text-decoration: underline; }
.link.neutral { color: #505a6a; }
.link:disabled { color: #858c98; text-decoration: none; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
td .actions { gap: 14px; }
.filters { display: flex; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; align-items: end; }
.filters label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
.filters input, .filters select { min-width: 112px; max-width: 190px; }
.filters input[type=date] { width: 128px; }
input:not([type=checkbox], [type=radio]), select, textarea {
  height: 34px; padding: 5px 10px; border: 1px solid var(--input); border-radius: 4px;
  background: #fff; color: var(--ink); max-width: 100%; min-width: 0;
}
input::placeholder, textarea::placeholder { color: #79808d; }
input[type=checkbox], input[type=radio] { accent-color: var(--blue); width: 15px; height: 15px; margin: 0; }
input[readonly], select:disabled { background: #fafafa; color: var(--muted); }
textarea { height: auto; resize: vertical; width: 100%; min-height: 78px; }
input[type=file] { height: auto; width: 100%; }
input[type=file]::file-selector-button { font: inherit; margin-right: 8px; }
select { text-overflow: ellipsis; }
.table-wrap { border: 1px solid var(--border); border-radius: 0; overflow-x: auto; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; vertical-align: middle; padding: 11px 15px; border-bottom: 1px solid var(--line); }
th { background: #fafafa; font-weight: 600; white-space: nowrap; color: #3d4655; }
td { min-height: 44px; }
td:first-child a { font-weight: 550; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fafafa; }
td.wrap { white-space: normal; overflow-wrap: anywhere; }
.table-wrap .empty { text-align: center; padding: 34px 12px; color: var(--muted); }
.manage th:nth-last-child(1) { min-width: 150px; }
.manage th:nth-last-child(2) { min-width: 95px; }
.manage th:nth-last-child(3) { min-width: 160px; }
.table-note { margin-bottom: 9px; color: var(--muted); font-size: 12px; }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 12px; }
.pager .current { color: var(--blue-dark); border-color: #adcbff; background: var(--blue-pale); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 12px; }
.block { margin-top: 22px; }
.section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
.meta { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); gap: 12px 26px; }
.meta dt { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.meta dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; white-space: nowrap; background: #fff; color: #4c5564; }
.tag.good { color: var(--green); border-color: #cde5d9; }
.tag.warn { color: var(--amber); border-color: #ebe0bd; }
.tag.bad { color: var(--red); border-color: #eed4d3; }
.tag.info { color: var(--blue-dark); border-color: #c8d9ff; }
.scores { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); border: 1px solid var(--border); padding: 16px 0; }
.stat { min-width: 0; padding: 0 16px; border-right: 1px solid var(--border); }
.stat:last-child { border: 0; }
.stat-label { font-size: 12px; color: var(--muted); }
.stat-value { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; margin: 3px 0; }
.metric-count { min-width: 60px; }
.metric-count .link { min-width: 22px; }
.notice { background: #fafafa; border: 1px solid var(--border); padding: 10px 12px; color: #495264; font-size: 13px; }
.notice.error { color: var(--red); border-color: #edd5d3; background: #fff; }
.notice[hidden] { display: none; }
.steps { margin: 0 0 23px; padding: 0 0 17px; list-style: none; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; border-bottom: 1px solid var(--border); }
.steps li { display: flex; align-items: center; gap: 9px; color: var(--muted); min-width: 0; }
.steps li:not(:last-child)::after { content: ""; flex: 1; min-width: 8px; margin-left: 4px; border-top: 1px solid var(--border); }
.steps .current-step { color: var(--ink); font-weight: 650; }
.step-index { display: grid; place-items: center; height: 25px; width: 25px; flex: 0 0 25px; border-radius: 50%; border: 1px solid var(--input); font-size: 12px; color: var(--muted); }
.current-step .step-index { background: var(--blue); border-color: var(--blue); color: #fff; }
.complete-step .step-index { background: var(--blue-pale); border-color: #c8d9ff; color: var(--blue-dark); }
.wizard-body { min-height: 285px; }
.form-row { display: grid; grid-template-columns: minmax(104px,145px) minmax(0,680px); align-items: start; gap: 12px; border-bottom: 1px solid var(--line); padding: 13px 0; }
.form-row:last-child { border-bottom: 0; }
.field-label { display: block; font-size: 13px; margin-top: 6px; font-weight: 550; }
.required { color: var(--red); margin-right: 5px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > input, .field > select { width: 100%; }
.field .hint { font-size: 12px; }
.check-line { display: flex; align-items: center; min-height: 34px; gap: 8px; }
.form-footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); margin-top: 24px; padding-top: 14px; }
.subform { margin-top: 14px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); padding: 12px; margin: 0; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #fafafa; }
details { font-size: 13px; color: var(--ink); }
details > summary { cursor: pointer; padding: 6px 0; font-weight: 550; }
details[open] > summary { margin-bottom: 4px; }
#overlay:empty { display: none; }
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(20 26 40 / 26%); }
.drawer, .dialog { position: fixed; z-index: 11; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border); }
.drawer { inset: 0 0 0 auto; width: min(50vw, 850px); min-width: min(540px, 100vw); }
.drawer.narrow { width: 34vw; min-width: min(450px, 100vw); }
.dialog { left: 50%; top: 23%; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); }
.overlay-head { padding: 16px var(--page); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); gap: 12px; }
.overlay-body { padding: 14px var(--page) 20px; overflow: auto; }
.drawer .overlay-body { flex: 1; }
.overlay-footer { padding: 12px var(--page); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
body.has-overlay { overflow: hidden; }
.toast { position: fixed; z-index: 20; inset: 12px auto auto 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 8px 15px; box-shadow: 0 2px 8px rgb(24 38 60 / 9%); max-width: calc(100vw - 24px); }
.trace-grid { display: grid; grid-template-columns: minmax(260px, 32%) minmax(0,1fr); border: 1px solid var(--border); min-height: 430px; }
.trace-list { border-right: 1px solid var(--border); min-width: 0; }
.trace-list-heading { background: #fafafa; border-bottom: 1px solid var(--line); padding: 9px 13px; color: var(--muted); font-size: 12px; }
.span-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 9px; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 9px 11px; width: 100%; text-align: left; color: var(--ink); }
.span-row:hover { background: #fafafa; }
.span-row.selected { background: var(--blue-pale); box-shadow: inset 2px 0 var(--blue); }
.span-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 550; }
.span-detail { padding: 15px; min-width: 0; }
.trace-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-label { padding: 7px 11px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.timeline { border-left: 1px solid #d9e1ee; padding-left: 13px; }
.timeline .span-row { position: relative; }
.timeline .span-row::before { content: ""; position: absolute; left: -17px; top: 15px; background: #fff; border: 1px solid #9aa9bf; width: 6px; height: 6px; border-radius: 50%; }
.elapsed { height: 3px; background: #dbe7ff; margin-top: 6px; border-radius: 0; }
.ellipsis { max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 840px) {
  :root { --page: 16px; }
  .meta { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .drawer, .drawer.narrow { width: min(100%, 580px); }
  .filters { gap: 8px; }
  .trace-grid { grid-template-columns: 1fr; }
  .trace-list { border-right: 0; border-bottom: 1px solid var(--border); }
  .scores { grid-template-columns: repeat(3,1fr); row-gap: 12px; }
  .stat:nth-child(3) { border: 0; }
}
@media (max-width: 510px) {
  .header-tail small { display: none; }
  .titlebar { flex-wrap: wrap; }
  h1 { font-size: 22px; }
  .steps { gap: 7px; font-size: 12px; }
  .steps li { gap: 4px; }
  .steps li::after { display: none; }
  .step-index { height: 20px; width: 20px; flex-basis: 20px; }
  .form-row { grid-template-columns: 1fr; gap: 5px; }
  .field-label { margin: 0; }
  .scores { grid-template-columns: repeat(2,1fr); }
  .stat:nth-child(3) { border-right: 1px solid var(--border); }
  .stat:nth-child(even) { border: 0; }
  .stat-value { font-size: 22px; }
}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="#/manage/tasks"><span class="brand-mark" aria-hidden="true">EV</span>Agent 评测平台</a>
  <div class="header-tail"><span class="tag">本地演示</span><small>Coze Loop</small></div>
</header>
<main id="app" aria-label="评测工作区"></main>
<div id="overlay"></div>
<div id="announcer" role="status" aria-live="polite"></div>
<script>
'use strict';


const app = document.querySelector('#app');
const overlay = document.querySelector('#overlay');
const announcer = document.querySelector('#announcer');
const storageKey = 'coze-loop-eval-demo-v1';
const stepNames = ['任务配置', '创建数据集', '评测规则', '任务确认'];
const kinds = {
  tasks: { tab: '评测任务', item: '任务', prefix: 'TASK', title: '评测任务', note: '配置单轮评测任务，管理运行批次与评测历史。' },
  datasets: { tab: '数据集', item: '数据集', prefix: 'DATA', title: '数据集', note: '管理评测样本及其导入快照。' },
  rules: { tab: '评测规则', item: '规则', prefix: 'RULE', title: '评测规则', note: '管理裁判 Prompt、输入变量与结果字段映射。' }
};
const sources = ['Excel', 'CSV', '飞书表格导出', 'SQL 查询结果'];
const dimensions = ['步骤拆解合理', '工具选择正确', '参数填充正确', '工具调用成功'];
const labels = { Pass: 'Pass', Fail: 'Fail', NA: 'NA', scored: '已评分', na: '无适用项', evidence: '证据缺失', invalid: '评分失败', waiting: '等待评分', canceled: '已取消' };
const grades = [
  ['Pass', 'Pass', 'Fail', 'Pass'],
  ['NA', 'NA', 'NA', 'Fail'],
  ['NA', 'NA', 'NA', 'NA']
];
const queries = [
  ['读取 tests/fixtures/settings.json，告诉我重试上限。', '重试上限为 3。'],
  ['读取 tests/fixtures/limits.json，列出超时时间。', '超时时间为 30 秒。'],
  ['把「评测结果已就绪」翻译成英文。', 'The evaluation results are ready.'],
  ['检查 tests/fixtures/features.json 里是否启用了缓存。', '缓存已启用。'],
  ['读取 tests/fixtures/regions.json，列出支持的地区。', '支持 cn、sg 两个地区。']
];
const fixtureRows = queries.map(([query, expected], i) => ({ id: 'CASE-' + String(i + 1).padStart(3, '0'), query, expected }));
const standardSchema = { scorePath: 'primary_dimension.total_score', reasonPath: 'primary_dimension.reason', metricPath: 'secondary_dimensions', key: 'name', value: 'result', max: 1 };
const alternateSchema = { scorePath: 'evaluation.total', reasonPath: 'evaluation.comment', metricPath: 'evaluation.checks', key: 'id', value: 'grade', max: 1 };
const standardVariables = ['query', 'tool_status'];
const defaultPrompt = '请根据用户问题 {{query}} 和工具调用状态 {{tool_status}}，评估可观察到的执行过程。逐项判定步骤拆解、工具选择、参数填充和工具调用是否满足标准，按约定 JSON 输出总分、各项判定和理由。无适用项时总分为 null。';

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clone = (value) => JSON.parse(JSON.stringify(value));
const byId = (kind, id) => state[kind].find((entry) => entry.id === id);
const ruleAt = (record, version = record.version) => version === record.version ? record : record.history?.find((item) => item.version === version) || record;
const datasetCell = (row, key) => (row.fields || row)[key];
function makeRule(id, name, date, schema = standardSchema) {
  return { id, name, date, owner: '评测管理员', version: 1, prompt: defaultPrompt, variables: standardVariables, schema, metrics: dimensions, history: [] };
}
function makeDataset(id, name, date, source, rows) {
  return { id, name, date, owner: '评测管理员', source, version: 1, queryKey: 'query', columns: ['query', 'expected'], rows };
}
function initial() {
  const rule = makeRule('RULE-001', '过程质量', '2026-11-19 16:40');
  const alt = makeRule('RULE-002', '过程质量 · 自定义 JSON', '2026-11-18 14:08', alternateSchema);
  const dataset = makeDataset('DATA-001', 'Harness 过程质量固定集', '2026-11-19 15:30', 'CSV', fixtureRows);
  const taskSpecs = [
    ['TASK-006', '过程质量回归评测', '2026-11-20 14:36', '评测管理员', 'DATA-001', 'RULE-001'],
    ['TASK-005', '工具调用稳定性检查', '2026-11-20 10:18', 'Agent 开发', 'DATA-001', 'RULE-001'],
    ['TASK-004', '基础问答样本评测', '2026-11-19 16:42', '评测管理员', 'DATA-002', 'RULE-001'],
    ['TASK-003', '自定义 JSON 输出验证', '2026-11-19 11:06', 'Agent 开发', 'DATA-001', 'RULE-002'],
    ['TASK-002', '规则映射验证', '2026-11-18 15:28', '评测管理员', 'DATA-003', 'RULE-002'],
    ['TASK-001', 'Harness 单轮冒烟评测', '2026-11-18 09:15', 'Agent 开发', 'DATA-002', 'RULE-001']
  ];
  const tasks = taskSpecs.map(([id, name, date, owner, datasetId, ruleId], i) => ({
    id, name, date, owner, datasetId, ruleId, ruleVersion: 1, version: 1, scene: 'DeepSeek Harness',
    mappings: { query: 'dataset:query', tool_status: 'trace:tool.result.status' },
    schedule: i === 1 ? { frequency: '每天', time: '09:00', day: '周一' } : null
  }));
  return {
    tasks, datasets: [
      dataset,
      makeDataset('DATA-002', '单轮问答样本', '2026-11-18 11:20', 'Excel', fixtureRows.slice(0, 3)),
      makeDataset('DATA-003', '工具事件样本', '2026-11-18 10:04', '飞书表格导出', fixtureRows.slice(3))
    ],
    rules: [rule, alt],
    runs: [
      makeRun('RUN-002', tasks[0], dataset, rule, '手动', '2026-11-20 15:20'),
      makeRun('RUN-001', tasks[3], dataset, alt, '手动', '2026-11-19 11:20')
    ],
    counts: { tasks: 6, datasets: 3, rules: 2, runs: 2 },
    draft: null
  };
}
function readState() {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey));
    if (data?.tasks && data?.counts) return data;
  } catch {}
  return initial();
}
let state = readState();
let activeModal = null;
let toastTimer;
let previewTimer;
let trialTimer;
const loadingRuns = new Map();
const manageSettings = {};
const resultSettings = {};
const traceSettings = {};
const pageSize = 5;

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {}
}
function stamp() {
  const date = new Date();
  const parts = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).format(date);
  return parts.replace(',', '');
}
function nextId(kind) {
  const n = ++state.counts[kind];
  return (kinds[kind]?.prefix || 'RUN') + '-' + String(n).padStart(3, '0');
}
function allocateEntry(kind, fields) {
  return { ...fields, id: nextId(kind), date: stamp(), owner: '当前用户', archived: false };
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  for (const key of keys.slice(0, -1)) {
    if (!Object.hasOwn(obj, key)) Object.defineProperty(obj, key, { value: {}, enumerable: true, writable: true });
    if (typeof obj[key] !== 'object' || obj[key] === null) return;

function parseCSV(text) {
  const records = [];
  let row = [], field = '', quote = false, closedQuote = false;
  const line = () => { row.push(field); if (row.some((cell) => cell !== '')) records.push(row); row = []; field = ''; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (closedQuote && ![',','\r','\n'].includes(c)) throw Error('CSV 引号位置无效。');
    if (c === '"') {
      if (quote && text[i + 1] === '"') { field += '"'; i++; }
      else if (quote) { quote = false; closedQuote = true; }
      else if (field === '') quote = true;
      else throw Error('CSV 引号位置无效。');
    } else if (!quote && c === ',') { closedQuote = false; row.push(field); field = ''; }
    else if (!quote && (c === '\r' || c === '\n')) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      closedQuote = false;
      line();
    } else field += c;
  }
  if (quote) throw Error('CSV 有未闭合的引号。');
  line();
  return records;
}
function validateGrid(grid) {
  const [head, ...rows] = grid;
  if (!head || !rows.length) throw Error('表格至少需要一行表头和一条样本。');
  const columns = head.map((name) => String(name ?? '').trim());
  if (columns.length > 25 || rows.length > 500) throw Error('演示支持最多 25 列和 500 条样本。');
  if (columns.some((name) => !name || ['__proto__', 'constructor', 'prototype'].includes(name))) throw Error('列名须非空，且不能使用保留字段。');
  if (new Set(columns).size !== columns.length) throw Error('表头有重复列名。');
  if (rows.some((row) => row.length > columns.length)) throw Error('部分样本的列数超过表头。');
  if (rows.some((row) => row.some((cell) => String(cell).length > 5000))) throw Error('单元格超过 5,000 字符。');
  return { columns, rows };
}
// Only reads plain stored values from an XLSX workbook.
async function readWorkbook(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const view = new DataView(bytes.buffer);
  let end = bytes.length - 22;
  while (end >= Math.max(0, bytes.length - 65557) && view.getUint32(end,true) !== 0x06054b50) end--;
  if (end < Math.max(0, bytes.length - 65557)) throw Error('无法读取 Excel 文件结构。');
  const count = view.getUint16(end+10,true);
  const map = new Map();
  let pos = view.getUint32(end+16,true);
  const decoder = new TextDecoder();
  for (let i = 0; i < count; i++) {
    if (view.getUint32(pos,true) !== 0x02014b50) throw Error('Excel 文件目录损坏。');
    const size = view.getUint32(pos+20,true), plain = view.getUint32(pos+24,true);
    const nameLen = view.getUint16(pos+28,true), method = view.getUint16(pos+10,true);
    const start = view.getUint32(pos+42,true);
    const name = decoder.decode(bytes.subarray(pos+46,pos+46+nameLen));
    map.set(name,{ start, size, plain, method });
    pos += 46 + nameLen + view.getUint16(pos+30,true) + view.getUint16(pos+32,true);
  }
  const xml = async (name) => {
    const entry = map.get(name);
    if (!entry || entry.plain > 5_000_000) throw Error('工作表文件缺失或解压后过大。');
    const offset = entry.start + 30 + view.getUint16(entry.start+26,true) + view.getUint16(entry.start+28,true);
    const packed = bytes.subarray(offset, offset + entry.size);
    if (![0,8].includes(entry.method)) throw Error('Excel 使用了无法识别的压缩方式。');
    const stream = new Blob([packed]).stream();
    const reader = (entry.method === 0 ? stream : stream.pipeThrough(new DecompressionStream('deflate-raw'))).getReader();
    const chunks = [];
    let length = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      length += value.byteLength;
      if (length > 5_000_000) { await reader.cancel(); throw Error('工作表解压后过大。'); }
      chunks.push(value);
    }
    const doc = new DOMParser().parseFromString(await new Blob(chunks).text(),'application/xml');
    if (doc.querySelector('parsererror')) throw Error('Excel 工作表 XML 损坏。');
    return doc;
  };
  const workbook = await xml('xl/workbook.xml');
  const relationships = await xml('xl/_rels/workbook.xml.rels');
  const strings = map.has('xl/sharedStrings.xml') ? [...(await xml('xl/sharedStrings.xml')).getElementsByTagName('si')].map((node) =>
    [...node.getElementsByTagName('t')].map((part) => part.textContent).join('')) : [];
  const sheets = [...workbook.getElementsByTagName('sheet')];
  if (sheets.length > 20) throw Error('工作簿最多支持 20 个工作表。');
  const entries = await Promise.all(sheets.map(async (sheet) => {
    const id = sheet.getAttribute('r:id');
    const rel = [...relationships.getElementsByTagName('Relationship')].find((element) => element.getAttribute('Id') === id);
    const target = rel?.getAttribute('Target') || '';
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    const doc = await xml(path);
    const formula = doc.getElementsByTagName('f')[0];
    const rows = [...doc.getElementsByTagName('row')].map((row) => {
      const result = [];
      for (const cell of row.getElementsByTagName('c')) {
        const position = (cell.getAttribute('r') || '').match(/^[A-Z]+/)?.[0] || 'A';
        const column = [...position].reduce((sum, letter) => sum * 26 + letter.charCodeAt(0) - 64, 0) - 1;
        if (column >= 25) throw Error('工作表超过 25 列。');
        const value = cell.getElementsByTagName('v')[0]?.textContent ?? '';
        const type = cell.getAttribute('t');
        result[column] = type === 's' ? strings[Number(value)] ?? '' : type === 'inlineStr'
          ? [...cell.getElementsByTagName('t')].map((item) => item.textContent).join('') : value;
      }
      return Array.from(result, (cell) => cell ?? '');
    }).filter((row) => row.some(Boolean));
    return { name: sheet.getAttribute('name'), rows, formulaCell: formula ? (formula.parentElement?.getAttribute('r') || '未知单元格') : null };
  }));
  if (!entries.length) throw Error('Excel 文件没有工作表。');
  return entries;
}

function startRun(task) {
  if (!task || task.archived || state.runs.some((run) => run.taskId === task.id && run.phase === 'running')) return;
  const dataset = byId('datasets',task.datasetId);
  const rule = ruleAt(byId('rules',task.ruleId),task.ruleVersion);
  const id = nextId('runs');
  const run = makeRun(id,task,dataset,rule,'手动',stamp());
  const target = clone(run.samples);
  run.phase = 'running';
  run.samples = run.samples.map(({ id,query,i,runId }) => ({ id,query,i,runId, status:'waiting', score:null, metrics:{} }));
  state.runs.push(run);
  save();
  go('run/' + id);
  const timer = setInterval(() => {
    const index = run.samples.findIndex((sample) => sample.status === 'waiting');
    if (index >= 0 && run.phase === 'running') run.samples[index] = target[index];
    if (index === target.length - 1 || index < 0 || run.phase !== 'running') {
      if (run.phase === 'running') run.phase = 'done';
      clearInterval(timer);
      loadingRuns.delete(id);
    }
    save();
    const [page,selected,detail] = pathParts();
    if (!activeModal && ((page === 'run' && selected === id && !detail) || (page === 'task' && selected === task.id))) render();

function parseRule(form) {

  const variables = [...new Set([...prompt.matchAll(/\{\{\s*([\w\u4e00-\u9fff]+)\s*\}\}/g)].map((match) => match[1]))];
  const metrics = Array.from(new Set(val('metrics').split(/[、\n,，]/).map((name) => name.trim()).filter(Boolean)));
  if (!ruleName || !prompt || !variables.length || !metrics.length) throw Error('规则名称、Prompt、至少一个 {{占位符}} 和一个指标为必填。');
  const schema = Object.fromEntries(['scorePath','reasonPath','metricPath','key','value'].map((key) => [key,val(key)]));

  const safe = (key) => /^[\w\u4e00-\u9fff-]+$/u.test(key) && !['__proto__','constructor','prototype'].includes(key);
  if (paths.some((path) => !path.split('.').every(safe)) || !safe(schema.key) || !safe(schema.value) || schema.key === schema.value) {
    throw Error('请填写合法的点分隔路径及不同的指标名称键、取值键。');
  }
  if (paths.some((item,i) => paths.some((other,j) => i !== j && (item === other || other.startsWith(item + '.')))) ||
      paths.some((path) => path === 'redline_fail_hits' || path.startsWith('redline_fail_hits.'))) {

  }
  if (name === 'generate-rule') {
    const form = button.closest('form');
    const goal = form.querySelector('#ruleGoal').value.trim();
    if (!goal) return overlayMessage(form,'请先填写评估目标。');
    form.querySelector('[data-error]').hidden = true;
    form.querySelector('#ruleName').value ||= goal.slice(0,80);
    form.querySelector('#prompt').value = '评估目标：' + goal + '。\n\n' + defaultPrompt;
    toast('已生成可编辑的模拟草稿');
  }
  if (name === 'cancel-draft') {
    openModal('取消创建任务', '<p>确认放弃当前任务草稿？已创建的数据集和规则仍可在管理页使用。</p>',{
      dialog:true, footer:action('放弃草稿','discard-draft','','primary')
    });
  }
  if (name === 'discard-draft') { state.draft = null; save(); go('manage/tasks'); }
  if (name === 'prev-step') { state.draft.step--; save(); render(); }
  if (name === 'trial') {
    const draft = state.draft;
    const dataset = byId('datasets',draft.datasetId);
    const rule = selectedRule(draft.ruleKey);
    if (!dataset || !rule) return;
    draft.trial = 'loading';
    save();
    render();
    clearTimeout(trialTimer);
    trialTimer = setTimeout(() => {
      if (state.draft === draft && draft.trial === 'loading') {
        draft.trial = true; save();
        if (pathParts()[0] === 'wizard' && !activeModal) render();
      }
    },550);
  }
  if (name === 'sample') openSample(run,id);
  if (name === 'run') startRun(byId('tasks',id));
  if (name === 'disable-schedule') {
    const task = byId('tasks',id);
    task.schedule = null; task.version++; save(); render(); toast('已停用定时');
  }
  if (name === 'refresh-run') { render(); toast('结果已刷新'); }
  if (name === 'confirm-cancel-run') {
    openModal('取消本批', '<p>停止尚未执行的样本，保留已完成的结果。本操作只作用于当前批次。</p>',{
      dialog:true, footer:action('确认取消本批','cancel-run',`data-run="${run}"`,'primary')
    });
  }
  if (name === 'cancel-run') cancelRun(runById(run));
  if (name === 'metric') {
    const [,id] = pathParts();
    resultSettings[id] = { page:1, values:{ metric:button.dataset.name, value:status } };
    render();
    document.querySelector('#sample-list')?.scrollIntoView({ block:'start' });
  }
}
async function handleChange(event) {
  const field = event.target;
  if (field.dataset.reveal) document.getElementById(field.dataset.reveal).hidden = !field.checked;
  if ('frequency' in field.dataset) document.getElementById('day').hidden = field.value !== '每周';
  if ('selectDataset' in field.dataset) return selectDataset(field.value);
  if ('selectRule' in field.dataset) return selectRule(field.value);
  if ('ruleMode' in field.dataset) document.getElementById('rule-ai').hidden = field.value !== 'ai';
  if (field.dataset.mapping) {
    const draft = state.draft, dataset = byId('datasets',draft.datasetId), rule = selectedRule(draft.ruleKey);
    const row = dataset.rows[0];
    draft.mappings[field.dataset.mapping] = field.value;
    draft.trial = false;
    const actual = draft.preview === 'ready' ? mappedValue(field.value,makeSample(row,rule,0,'preview'),row) : undefined;
    const display = field.closest('.field').querySelector('[data-mapped]');
    display.textContent = actual ?? (draft.preview === 'ready' ? '当前样本暂无取值' : '等待预览');
    save();
  }
  if (field.id === 'sheet') setImportPreview(field.form);
  if (field.id !== 'datasetFile' || !field.files[0]) return;
  const [file] = field.files;
  const form = field.form;
  form.grid = null;
  form.querySelector('[data-import-preview]').textContent = '';
  form.querySelector('[data-sheet]').hidden = true;
  form.querySelector('[data-filename]').textContent = '读取中…';
  try {
    if (file.size > 5_000_000) throw Error('文件大小超过 5 MB。');
    const ext = file.name.split('.').at(-1).toLowerCase();
    if (!['csv','xlsx'].includes(ext)) throw Error('请选择 .csv 或 .xlsx 文件。');
    const workbook = ext === 'xlsx' ? await readWorkbook(file)
      : [{ name:'CSV', rows:parseCSV(await file.text()) }];
    if (form.isConnected && field.files[0] === file) showWorkbook(form,workbook,file.name);
  } catch(error) {
    if (form.isConnected && field.files[0] === file) {
      form.querySelector('[data-filename]').textContent = file.name;
      overlayMessage(form,error.message || '文件读取失败。');
    }
  }
}
document.addEventListener('click',handleClick);
document.addEventListener('submit',submitForm);
document.addEventListener('change',handleChange);
document.addEventListener('input',(event) => {
  const form = event.target.form;
  if (form?.dataset.form === 'wizard' && state.draft?.step === 0) {
    Object.assign(state.draft,fieldConfig(form));
    save();
  }
});
document.addEventListener('keydown',(event) => {
  if (!activeModal) return;
  if (event.key === 'Escape') overlay.querySelector('.overlay-head button')?.click();
  if (event.key === 'Tab') {
    const focusable = [...overlay.querySelectorAll('a[href], button, input, select, textarea, summary')].filter((item) => !item.disabled && item.getClientRects().length);
    const [first] = focusable, last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
    if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
  }
});
window.addEventListener('hashchange',render);
window.addEventListener('popstate',(event) => { if (event.state) render(); });
if (state.draft?.preview === 'loading') startPreview(state.draft.datasetId);
if (state.draft?.trial === 'loading') state.draft.trial = false;
for (const run of state.runs) {
  if (run.phase === 'running') {
    run.phase = 'canceled';
    for (const sample of run.samples) if (sample.status === 'waiting') sample.status = 'canceled';
  }
}
save();
render();
</script>
</body>
</html>
